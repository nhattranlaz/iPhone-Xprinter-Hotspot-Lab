name: Android LAB APK
on:
  push:
    paths:
      - 'android-lab/**'
      - '.github/workflows/android-lab.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-lab
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: xprinter-hotspot-android-lab
          path: android-lab/app/build/outputs/apk/debug/app-debug.apk
