name: XprinterHotspotLab
options:
  bundleIdPrefix: com.nhattranlaz
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  XprinterHotspotLab:
    type: application
    platform: iOS
    sources:
      - XprinterHotspotLab
    resources:
      - XprinterHotspotLab/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhattranlaz.xprinterhotspotlab
        PRODUCT_NAME: Xprinter Hotspot Lab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Xprinter Hotspot Lab
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Kết nối trực tiếp tới máy in Xprinter trong mạng Wi-Fi/Personal Hotspot để thử in.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: XprinterHotspotLab/XprinterHotspotLab-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/XprinterHotspotLab/Vendor/Common/ESPUtils"
          - "$(SRCROOT)/XprinterHotspotLab/Vendor/ESPTouch/esptouch"
          - "$(SRCROOT)/XprinterHotspotLab/Vendor/ESPTouch/protocol"
          - "$(SRCROOT)/XprinterHotspotLab/Vendor/ESPTouch/task"
          - "$(SRCROOT)/XprinterHotspotLab/Vendor/ESPTouch/udp"
          - "$(SRCROOT)/XprinterHotspotLab/Vendor/ESPTouchV2"
          - "$(SRCROOT)/XprinterHotspotLab/Vendor/CocoaAsyncSocket/GCD"
